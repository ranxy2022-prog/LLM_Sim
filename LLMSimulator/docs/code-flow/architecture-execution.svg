<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一份模型，三种不同的组织结构。" viewBox="0 -115 1070 1015" width="1070" height="1015"><rect x="0" y="-115" width="1070" height="1015" fill="#fdfdf9"/><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.node-bg{fill:#fffefa;stroke:#d5ddd1;stroke-width:1.2}.node-title{font-weight:650;fill:#263d30}.node-role{font-size:12px;fill:#69786e}.node-file{font-size:10px;fill:#8b978d}.edge{fill:none;stroke-width:1.5}.edge-label{font-size:10px;fill:#5a6d60;paint-order:stroke;stroke:#fdfdf9;stroke-width:5px}.read-dot{display:none}</style><title>一份模型，三种不同的组织结构。</title><desc>Module 是模型组合树，ModuleGraph 是执行记录，TimeStamp 是统计树节点。TopModuleGraph 把后两者组织到每个 Device 上。</desc><defs><marker id="arrow-child" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b7b5e"/></marker><marker id="arrow-value" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aa8439"/></marker><marker id="arrow-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a978e"/></marker><marker id="arrow-create" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b78a7"/></marker></defs><g><path class="edge" d="M520 132 L520 181 L170 181 L170 230" stroke="#3b7b5e" marker-end="url(#arrow-child)"/><text class="edge-label" x="170" y="216" text-anchor="middle">top_module_graph</text></g><g><path class="edge" d="M520 132 L520 181 L520 181 L520 230" stroke="#aa8439" marker-end="url(#arrow-value)"/><text class="edge-label" x="520" y="216" text-anchor="middle">status</text></g><g><path class="edge" d="M520 132 L520 181 L870 181 L870 230" stroke="#aa8439" marker-end="url(#arrow-value)"/><text class="edge-label" x="870" y="216" text-anchor="middle">3 个结果槽</text></g><g><path class="edge" d="M170 342 L170 406 L170 406 L170 470" stroke="#3b7b5e" marker-end="url(#arrow-child)"/><text class="edge-label" x="170" y="456" text-anchor="middle">module_graph · 有序 vector</text></g><g><path class="edge" d="M170 342 L170 406 L520 406 L520 470" stroke="#aa8439" marker-end="url(#arrow-value)"/><text class="edge-label" x="520" y="456" text-anchor="middle">timeboard</text></g><g><path class="edge" d="M300 286 L390 286" stroke="#8a978e" stroke-dasharray="6 5" marker-end="url(#arrow-ref)"/><text class="edge-label" x="345" y="277" text-anchor="middle">status &amp;</text></g><g><path class="edge" d="M300 526 L345 526 L345 286 L390 286" stroke="#8a978e" stroke-dasharray="6 5" marker-end="url(#arrow-ref)"/><text class="edge-label" x="344" y="392" text-anchor="middle">status &amp;</text></g><g><path class="edge" d="M170 470 L170 421 L870 421 L870 470" stroke="#8a978e" stroke-dasharray="6 5" marker-end="url(#arrow-ref)"/><text class="edge-label" x="755" y="410" text-anchor="middle">module · 进入记录指针；退出为 null</text></g><g><path class="edge" d="M520 582 L520 646 L520 646 L520 710" stroke="#aa8439" marker-end="url(#arrow-value)"/><text class="edge-label" x="520" y="696" text-anchor="middle">top · 值成员</text></g><g><path class="edge" d="M650 766 L740 766" stroke="#aa8439" marker-end="url(#arrow-value)"/><text class="edge-label" x="695" y="757" text-anchor="middle">status</text></g><g><path class="edge" d="M390 766 L345 766 L345 848 L520 848 L520 822" stroke="#3b7b5e" marker-end="url(#arrow-child)"/><text class="edge-label" x="440" y="873" text-anchor="middle">leafstamp · 递归持有子时间戳</text></g><g class="node" data-type="Device" transform="translate(390,20)" role="button" tabindex="0" aria-label="查看 Device 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">Device</text><text class="node-role" x="17" y="56">每设备一份 · 本图展开其中一台</text><text class="node-file" x="17" y="95">hardware/device.h:19</text><circle class="read-dot" data-type="Device" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="TopModuleGraph" transform="translate(40,230)" role="button" tabindex="0" aria-label="查看 TopModuleGraph 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">TopModuleGraph</text><text class="node-role" x="17" y="56">记录容器 + 游标 + 统计树</text><text class="node-file" x="17" y="95">module/module_graph.h:123</text><circle class="read-dot" data-type="TopModuleGraph" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="StatusBoard" transform="translate(390,230)" role="button" tabindex="0" aria-label="查看 StatusBoard 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">StatusBoard</text><text class="node-role" x="17" y="56">设备实时累计状态</text><text class="node-file" x="17" y="95">module/status.h:68</text><circle class="read-dot" data-type="StatusBoard" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="ExecStatus" transform="translate(740,230)" role="button" tabindex="0" aria-label="查看 ExecStatus 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">ExecStatus</text><text class="node-role" x="17" y="56">当前算子 / high / low 暂存结果</text><text class="node-file" x="17" y="95">module/status.h:16</text><circle class="read-dot" data-type="ExecStatus" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="ModuleGraph" transform="translate(40,470)" role="button" tabindex="0" aria-label="查看 ModuleGraph 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">ModuleGraph</text><text class="node-role" x="17" y="56">一条进入 / 退出记录</text><text class="node-file" x="17" y="95">module/module_graph.h:24</text><circle class="read-dot" data-type="ModuleGraph" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="TimeBoard" transform="translate(390,470)" role="button" tabindex="0" aria-label="查看 TimeBoard 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">TimeBoard</text><text class="node-role" x="17" y="56">管理当前统计位置与根节点</text><text class="node-file" x="17" y="95">module/timeboard.h:108</text><circle class="read-dot" data-type="TimeBoard" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="Module" transform="translate(740,470)" role="button" tabindex="0" aria-label="查看 Module 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">Module</text><text class="node-role" x="17" y="56">已有的模型模块 · 不被复制</text><text class="node-file" x="17" y="95">module/module.h:19</text><circle class="read-dot" data-type="Module" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="TimeStamp" transform="translate(390,710)" role="button" tabindex="0" aria-label="查看 TimeStamp 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">TimeStamp</text><text class="node-role" x="17" y="56">根节点及递归子节点</text><text class="node-file" x="17" y="95">module/timeboard.h:14</text><circle class="read-dot" data-type="TimeStamp" cx="244" cy="17" r="4" style="display:none"/></g><g class="node" data-type="StatusBoard" transform="translate(740,710)" role="button" tabindex="0" aria-label="查看 StatusBoard 对象组成"><rect class="node-bg" width="260" height="112" rx="10"/><rect x="0" y="16" width="3" height="25" rx="1" fill="#75926b"/><text class="node-title" x="17" y="33" font-size="16">StatusBoard</text><text class="node-role" x="17" y="56">时间戳内嵌的状态副本</text><text class="node-file" x="17" y="95">module/status.h:68</text><circle class="read-dot" data-type="StatusBoard" cx="244" cy="17" r="4" style="display:none"/></g><text x="20" y="-72" font-size="24" fill="#24392f">LLMSimulator · Device 与执行图</text><text x="20" y="-36" font-size="12" fill="#68766e">绿实线：子对象　金实线：值成员　灰虚线：引用　紫点线：创建/临时产物 · 按当前配置与源码归纳</text></svg>